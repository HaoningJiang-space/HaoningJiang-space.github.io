{% assign names = include.paper.authors | split: ', ' %}
<p class="author-line">
  {%- for name in names -%}
    <span class="author-name">{{ name | escape | replace: 'Haoning Jiang', '<strong>Haoning Jiang</strong>' | replace: '*', '<sup>*</sup>' | replace: '†', '<sup>†</sup>' }}{% unless forloop.last %},{% endunless %}</span>{% unless forloop.last %}&#32;{% endunless %}
  {%- endfor -%}
</p>

<header class="masthead">
  <nav class="site-menu" aria-label="Main navigation">
    {% if page.url == '/' %}
      <a class="site-menu__name" href="https://hkust.edu.hk/">HKUST <span class="affiliation-unit">/ ECE</span></a>
    {% else %}
      <a class="site-menu__name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    {% endif %}
    <ul>
      <li><a href="{{ '/' | relative_url }}#research">Research</a></li>
      <li><a href="{{ '/' | relative_url }}#news">News</a></li>
      {% for link in site.data.navigation.main %}
        {% if link.url == '/' %}{% continue %}{% endif %}
        <li><a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% elsif page.collection == 'publications' and link.url == '/publications/' %} aria-current="location"{% endif %}>{{ link.title }}</a></li>
      {% endfor %}
    </ul>
  </nav>
</header>

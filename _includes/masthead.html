<header class="masthead">
  <div class="masthead__inner-wrap">
    <nav class="site-menu" aria-label="Main navigation">
      <a class="site-menu__name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <ul>
        {% for link in site.data.navigation.main %}
          <li><a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>

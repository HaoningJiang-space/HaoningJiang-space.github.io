{% if page.previous or page.next %}
  <nav class="adjacent-pages" aria-label="More in this collection">
    {% if page.previous %}<a rel="prev" href="{{ page.previous.url | relative_url }}"><small>Previous</small>{{ page.previous.title | escape }}</a>{% endif %}
    {% if page.next %}<a rel="next" href="{{ page.next.url | relative_url }}"><small>Next</small>{{ page.next.title | escape }}</a>{% endif %}
  </nav>
{% endif %}

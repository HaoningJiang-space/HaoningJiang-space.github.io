---
layout: compress
---
<!doctype html>
<html lang="{{ page.lang | default: site.locale | replace: '_', '-' }}">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>
  <body class="academic-site{% if page.url == '/' %} profile-page{% endif %}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include masthead.html %}
    <div id="content-container">{{ content }}</div>
    <footer class="site-footer">
      <span>&copy; {{ site.time | date: '%Y' }} {{ site.name }}</span>
      <nav aria-label="Site resources">
        <a href="{{ '/sitemap/' | relative_url }}">Sitemap</a>
        <a href="{{ '/feed.xml' | relative_url }}">Feed</a>
        <a href="https://github.com/academicpages/academicpages.github.io">AcademicPages</a>
      </nav>
    </footer>
    {% include scripts.html %}
  </body>
</html>
